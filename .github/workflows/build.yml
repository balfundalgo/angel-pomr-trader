name: Build Windows EXE

# Builds a standalone .exe on every push to main and on manual dispatch.
# Download the artifact from the workflow run page (Actions tab).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Offline logic tests
        working-directory: src
        run: python test_logic.py

  build:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: >
          pyinstaller
          --onefile
          --windowed
          --name POMR_Trader
          --collect-all customtkinter
          --collect-all SmartApi
          --hidden-import pyotp
          --hidden-import logzero
          --hidden-import websocket
          --hidden-import SmartApi.smartWebSocketV2
          --hidden-import pandas
          --hidden-import numpy
          --paths src
          src/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: POMR_Trader-windows
          path: dist/POMR_Trader.exe
          if-no-files-found: error
